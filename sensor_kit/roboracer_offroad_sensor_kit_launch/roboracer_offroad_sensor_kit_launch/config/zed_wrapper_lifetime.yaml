/**:
  ros__parameters:
    general:
      grab_resolution: 'HD1080'
      grab_frame_rate: 60
    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: 'GEN_1'
      imu_fusion: true
      set_gravity_as_origin: true
      area_memory: true
      area_file_path: ''  # overridden at launch by pos_tracking.area_file_path:=$(map_path)/area.area
      enable_localization_only: true   # false -> lifetime: extend the map
      save_area_memory_on_closing: false # write updated map on shutdown
      publish_pose_cov: true
      publish_tf: false
      publish_map_tf: false

    depth:
      depth_mode: 'NEURAL_LIGHT'
      point_cloud_freq: 15.0
      point_cloud_res: 'COMPACT'
