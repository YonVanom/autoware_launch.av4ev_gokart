/**:
  ros__parameters:
    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: 'GEN_3'
      imu_fusion: true
      set_gravity_as_origin: true
      area_memory: true
      area_file_path: ''  # overridden at launch by pos_tracking.area_file_path:=$(map_path)/area.area
      enable_localization_only: false   # lifetime: extend the map
      save_area_memory_on_closing: true # write updated map on shutdown
      publish_pose_cov: true

    depth:
      depth_mode: 'NEURAL_LIGHT'
      point_cloud_freq: 10.0
      point_cloud_res: 'COMPACT'
