/**:
  ros__parameters:
    # motion state constraints
    stop_decel: 0.0

    # external velocity limit parameter
    margin_to_insert_external_velocity_limit: 0.3

    # -- curve parameters --
    curvature_calculation_distance: 1.0   # [m] — shorter for RC car scale

    # lateral acceleration limit: controls how fast the car takes corners.
    # v_max = sqrt(a_lat * R); at 6.0 m/s² and 2m radius → 3.5 m/s in corner.
    enable_lateral_acc_limit: true
    lateral_acceleration_limits: [1.5, 1.5, 1.5, 1.5]   # ~6 km/h at 2m radius: v = sqrt(1.5 × 2) = 1.73 m/s
    min_curve_velocity: 1.0                               # allow slowing to 1 m/s in tight corners
    decel_distance_before_curve: 0.8                      # short circuit: brake late [m]
    decel_distance_after_curve: 0.4                       # accelerate out quickly [m]
    min_decel_for_lateral_acc_lim_filter: -4.0            # hard braking into corners [m/ss]

    # steering angle rate limit (prevents planning impossible steer maneuvers at speed)
    enable_steering_rate_limit: true
    velocity_thresholds: [0.5, 1.0, 4.0, 8.0]            # [m/s] — tuned for RC car speed range
    steering_angle_rate_limits: [80.0, 70.0, 55.0, 40.0] # [deg/s]
    resample_ds: 0.1
    curvature_threshold: 0.02

    # engage & replan parameters
    replan_vel_deviation: 5.53
    engage_velocity: 0.25
    engage_acceleration: 0.5
    engage_exit_ratio: 0.5
    stop_dist_to_prohibit_engage: 0.5

    # stop velocity — only apply full-stop behavior for actual 0-speed waypoints.
    # Must be below the minimum corner speed (~1.5 m/s); previously 2.778 caused the
    # smoother to treat every corner target as a stop and brake to 0.
    stopping_velocity: 0.3
    stopping_distance: 0.0

    # path extraction parameters
    extract_ahead_dist: 200.0
    extract_behind_dist: 5.0
    delta_yaw_threshold: 1.0472

    # resampling parameters for optimization
    max_trajectory_length: 200.0
    min_trajectory_length: 180.0
    resample_time: 2.0
    dense_resample_dt: 0.2
    dense_min_interval_distance: 0.1
    sparse_resample_dt: 0.5
    sparse_min_interval_distance: 4.0

    # resampling parameters for post process
    post_max_trajectory_length: 300.0
    post_min_trajectory_length: 30.0
    post_resample_time: 10.0
    post_dense_resample_dt: 0.1
    post_dense_min_interval_distance: 0.1
    post_sparse_resample_dt: 0.1
    post_sparse_min_interval_distance: 1.0

    # system
    over_stop_velocity_warn_thr: 1.389
    plan_from_ego_speed_on_manual_mode: true
